version: v3

teleport:
  nodename: teleport-node
  data_dir: /var/lib/teleport

  # Token generado en el auth server
  auth_token: "node:token_auth_server" # añadir despues de solicitarlo en server

  # nombre del servicio en docker-compose
  auth_server: "teleport-server:3025"

# desactivado porque es un nodo y no actua como servidor autenticacion
auth_service:
  enabled: false

proxy_service:
  enabled: false

ssh_service:
  enabled: true
  labels:
    env: demo
